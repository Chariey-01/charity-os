services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-charityos}
      POSTGRES_USER: ${POSTGRES_USER:-charityos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charityos-local}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - charityos-postgres:/var/lib/postgresql/data

volumes:
  charityos-postgres:

