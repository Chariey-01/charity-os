[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --reuse-db"

